        (function() {
            function replaceBrand(value) {
                return value
                    .replace(/1xbet/gi, "NESXBET")
                    .replace(/xbetshop/gi, "NESXBET")
                    .replace(/(^|[^A-Za-z])xbet([^A-Za-z]|$)/gi, "$1NESXBET$2");
            }

            function cleanNode(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    var text = replaceBrand(node.nodeValue);
                    if (text !== node.nodeValue) {
                        node.nodeValue = text;
                    }
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(node.tagName)) {
                    return;
                }
                if (node.matches("a, link")) {
                    var href = node.getAttribute("href") || "";
                    if (/1xbet\.com|xbetshop\.com/i.test(href)) {
                        node.setAttribute("href", "/");
                    }
                }
                ["title", "alt", "aria-label", "content"].forEach(function(attribute) {
                    if (node.hasAttribute(attribute)) {
                        var current = node.getAttribute(attribute);
                        var updated = replaceBrand(current);
                        if (updated !== current) {
                            node.setAttribute(attribute, updated);
                        }
                    }
                });
                Array.prototype.forEach.call(node.childNodes, cleanNode);
            }

            function cleanPage() {
                cleanNode(document.head);
                cleanNode(document.body);
                document.title = "NESXBET | Betting Agent Platform";
            }

            document.addEventListener("DOMContentLoaded", function() {
                cleanPage();
                new MutationObserver(function(records) {
                    records.forEach(function(record) {
                        if (record.type === "characterData") {
                            cleanNode(record.target);
                        } else {
                            Array.prototype.forEach.call(record.addedNodes, cleanNode);
                        }
                    });
                }).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
                new MutationObserver(function(records) {
                    records.forEach(function(record) {
                        Array.prototype.forEach.call(record.addedNodes, cleanNode);
                    });
                }).observe(document.head, {
                    childList: true,
                    subtree: true
                });
                var title = document.querySelector("title");
                if (title) {
                    new MutationObserver(function() {
                        if (document.title !== "NESXBET | Betting Agent Platform") {
                            document.title = "NESXBET | Betting Agent Platform";
                        }
                    }).observe(title, {
                        childList: true,
                        characterData: true,
                        subtree: true
                    });
                }
            });
        })();
    </script>

                translations[code]["CONTACT US"] = translations[code]["CONTACT US"] || "CONTACT US · " + code.toUpperCase();
            });
            var languageCodes = Object.keys(flags);
            var originalText = new WeakMap();

            function addFlags() {
                var candidates = document.querySelectorAll("a, button, li, span, div");
                candidates.forEach(function(node) {
                    var code = (node.textContent || "").trim().toUpperCase();
                    if (languageCodes.indexOf(code) === -1 || node.children.length > 0 && node.textContent.trim() !== code) {
                        return;
                    }
                    var menu = node.parentElement;
                    for (var level = 0; menu && level < 5; level++, menu = menu.parentElement) {
                        var count = Array.prototype.filter.call(menu.querySelectorAll("*"), function(child) {
                            return languageCodes.indexOf((child.textContent || "").trim().toUpperCase()) !== -1;
                        }).length;
                        if (count >= 5) {
                            menu.classList.add("nestx-language-menu");
                            break;
                        }
                    }
                    if (!node.classList.contains("nestx-language-option")) {
                        node.classList.add("nestx-language-option");
                        node.dataset.languageCode = code.toLowerCase();
                        var flag = document.createElement("span");
                        flag.className = "nestx-language-flag";
                        flag.textContent = flags[code] || "🌐";
                        node.insertBefore(flag, node.firstChild);
                    }
                });
                var languageMenu = document.querySelector(".nestx-language-menu");
                if (languageMenu && !languageMenu.querySelector('[data-language-code="np"]')) {
                    var nepalOption = document.createElement("a");
                    nepalOption.href = "/ne";

                    nepalOption.dataset.languageCode = "np";

                    languageMenu.appendChild(nepalOption);
                }
            }

            function translate(language) {
                var dictionary = translations[language] || {};
                document.querySelectorAll("body *").forEach(function(node) {
                    if (node.children.length || !node.firstChild || node.tagName === "SCRIPT" || node.tagName === "STYLE") {
                        return;
                    }
                    var current = (node.textContent || "").trim();
                    if (!originalText.has(node)) {
                        originalText.set(node, current);
                    }
                    var source = originalText.get(node);
                    if (dictionary[source]) {
                        node.textContent = dictionary[source];
                    } else if (language === "en" && source !== current) {
                        node.textContent = source;
                    }
                });
                if (language === "ne") {
                    document.title = translations.ne["NESXBET | Betting Agent Platform"];
                }
            }

            function setupLanguageMenu() {
                addFlags();
                document.querySelectorAll(".nestx-language-option").forEach(function(option) {
                    if (option.dataset.nestxBound) return;
                    option.dataset.nestxBound = "1";
                    option.addEventListener("click", function(event) {

                        event.stopPropagation();
                        var code = option.dataset.languageCode || option.textContent.trim().slice(-2).toLowerCase();
                        if (code === "np") code = "ne";

                        translate(code);
                        addFlags();
                    }, true);
                });
                var selected = localStorage.getItem("nestx-language") || "en";
                document.documentElement.lang = selected;
                document.body.dataset.selectedLanguage = selected;

    <script>
        (function() {
            function updateHeroTitle() {
                var title = document.querySelector(".x-bet-shop-main-title");
                if (!title || title.dataset.nesxTitleApplied === "1") {
                    updateAgentTitle();
                    return;
                }
                title.innerHTML = "Make money<br>with <span class=\"x-bet-shop-main-title__blue\">NesxBet</span>";
                title.dataset.nesxTitleApplied = "1";
                updateAgentTitle();
            }

            function updateAgentTitle() {
                var title = document.querySelector(".x-bet-shop-agent__title");
                if (!title) {
                    return;
                }
                var text = title.textContent.replace(/\s+/g, " ").trim();
                if (text === "Who are NesXbet agents?") {
                    return;
                }
                title.innerHTML = "Who are <span class=\"x-bet-shop-main-title__blue\">NesXbet</span> agents?";
            }

            function updateAgentModal() {
                var modal = document.querySelector(".v--modal-box, [role=\"dialog\"]");
                if (!modal) {
                    return;
                }
                modal.querySelectorAll("*").forEach(function(node) {
                    if (node.children.length === 0 && /1xBet/i.test(node.textContent)) {
                        node.textContent = node.textContent.replace(/1xBet/gi, "NesXbet");
                    }
                });
            }

            function updateWhyTitle() {
                document.querySelectorAll("h1, h2, h3, h4, p, span").forEach(function(node) {
                    if (node.children.length === 0 && /Why (?:1xBet|1NesxBet|NesxBet)\?/i.test(node.textContent)) {
                        node.textContent = node.textContent.replace(/Why (?:1xBet|1NesxBet|NesxBet)\?/gi, "Why NesxBet?");
                    }
                });
            }

            function removeHeaderCookiePolicy() {
                document.querySelectorAll("*").forEach(function(node) {
                    var text = (node.textContent || "").replace(/\s+/g, " ").trim();
                    if (!/^cookie\s*policy$/i.test(text) || node.children.length > 0) {
                        return;
                    }
                    var item = node;
                    while (item && item !== document.body) {
                        var className = typeof item.className === "string" ? item.className : "";
                        if (/menu|header/i.test(className)) {
                            item.style.setProperty("display", "none", "important");
                            return;
                        }
                        item = item.parentElement;
                    }
                    if (node.parentElement) {
                        node.parentElement.style.setProperty("display", "none", "important");
                    }
                });
            }

            function showAgentPopup() {
                if (document.querySelector(".nesx-agent-popup-backdrop")) {
                    return;
                }
                var backdrop = document.createElement("div");
                backdrop.className = "nesx-agent-popup-backdrop";
                backdrop.innerHTML = [
                    "<section class=\"nesx-agent-popup\" role=\"dialog\" aria-modal=\"true\">",
                    "<button class=\"nesx-agent-popup__close\" type=\"button\" aria-label=\"Close\">&times;</button>",
                    "<h2>Become a NesXbet agent</h2>",
                    "<div class=\"nesx-agent-popup__grid\">",
                    "<select class=\"nesx-agent-popup__full\" name=\"country\" aria-label=\"Country\"><option>Country</option></select>",
                    "<input class=\"nesx-agent-popup__full\" name=\"firstName\" type=\"text\" placeholder=\"First name\">",
                    "<input name=\"email\" type=\"email\" placeholder=\"Email address\">",
                    "<input name=\"phone\" type=\"tel\" placeholder=\"Phone number\">",
                    "<select class=\"nesx-agent-popup__full\" name=\"contactMethod\" aria-label=\"Method of contact\"><option>Method of contact</option><option>WhatsApp</option><option>Telegram</option><option>Email</option></select>",
                    "<input class=\"nesx-agent-popup__full nesx-agent-popup__contact-details\" name=\"contactDetails\" type=\"text\" placeholder=\"Telegram username or contact details\" aria-label=\"Telegram username or contact details\">",
                    "<textarea class=\"nesx-agent-popup__full\" name=\"message\" placeholder=\"Your message\"></textarea>",
                    "</div>",
                    "<p class=\"nesx-agent-popup__status\" role=\"status\" aria-live=\"polite\"></p>",
                    "<button class=\"nesx-agent-popup__submit\" type=\"button\">SEND</button>",
                    "</section>"
                ].join("");
                document.body.appendChild(backdrop);

                var countrySelect = backdrop.querySelector("[name=country]");
                fetch("/web-api/country/all?popup=1", { cache: "no-store" })
                    .then(function(response) { return response.json(); })
                    .then(function(countries) {
                        countries.forEach(function(country) {
                            var option = document.createElement("option");
                            option.value = country.alpha;
                            option.textContent = country.name + " (+" + country.phoneCode + ")";
                            countrySelect.appendChild(option);
                        });
                    })
                    .catch(function(error) {
                        console.error("Unable to load popup countries", error);
                    });

                function close() {
                    backdrop.remove();
                }
                var contactMethod = backdrop.querySelector("[name=contactMethod]");
                var contactDetails = backdrop.querySelector("[name=contactDetails]");
                contactMethod.addEventListener("change", function() {
                    var method = contactMethod.value;
                    var detailsRequired = method === "Telegram" || method === "WhatsApp";
                    contactDetails.style.display = detailsRequired ? "block" : "none";
                    contactDetails.required = detailsRequired;
                    contactDetails.placeholder = method === "WhatsApp"
                        ? "Enter your WhatsApp number"
                        : "Enter your Telegram username (e.g. @username)";
                    if (!detailsRequired) {
                        contactDetails.value = "";
                    }
                });
                var submitButton = backdrop.querySelector(".nesx-agent-popup__submit");
                var status = backdrop.querySelector(".nesx-agent-popup__status");
                submitButton.addEventListener("click", function() {
                    var formData = {};
                    backdrop.querySelectorAll("input, select, textarea").forEach(function(field) {
                        formData[field.name] = field.value.trim();
                    });
                    if (!formData.firstName || !formData.email || !formData.message) {
                        status.textContent = "Please fill in your name, email, and message.";
                        return;
                    }
                    if ((formData.contactMethod === "Telegram" || formData.contactMethod === "WhatsApp") && !formData.contactDetails) {
                        status.textContent = formData.contactMethod === "WhatsApp"
                            ? "Please enter your WhatsApp number."
                            : "Please enter your Telegram username or contact details.";
                        return;
                    }
                    submitButton.disabled = true;
                    submitButton.textContent = "SENDING...";
                    status.textContent = "";
                    fetch("/api/contact", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(formData)
                    }).then(function(response) {
                        return response.json().then(function(result) {
                            if (!response.ok) {
                                throw new Error(result.message || "Unable to send message");
                            }
                            return result;
                        });
                    }).then(function(result) {
                        status.textContent = result.message;
                        submitButton.textContent = "SENT";
                        backdrop.querySelectorAll("input, select, textarea").forEach(function(field) {
                            field.disabled = true;
                        });
                    }).catch(function(error) {
                        status.textContent = error.message;
                        submitButton.disabled = false;
                        submitButton.textContent = "SEND";
                    });
                });
                backdrop.querySelector(".nesx-agent-popup__close").addEventListener("click", close);
                backdrop.addEventListener("click", function(event) {
                    if (event.target === backdrop) {
                        close();
                    }
                });
            }

            function bindAgentButtons() {
                document.addEventListener("click", function(event) {
                    var button = event.target.closest("button, a");
                    if (!button || !/(become\s+an\s+agent|start\s+earning)/i.test(button.textContent || "")) {
                        return;
                    }
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    showAgentPopup();
                }, true);
            }

            document.addEventListener("DOMContentLoaded", function() {
                updateHeroTitle();
                updateAgentTitle();
                updateAgentModal();
                updateWhyTitle();
                removeHeaderCookiePolicy();
                bindAgentButtons();
                new MutationObserver(function() {
                    updateHeroTitle();
                    updateAgentTitle();
                    updateAgentModal();
                    updateWhyTitle();
                    removeHeaderCookiePolicy();
                }).observe(document.body, {
                    childList: true,
                    subtree: true
                });
            });
        })();
    </script>
